name: Validate translations

# The one check translation changes must pass. merge_gate.py requires its
# "validate" job before translate.yml / reconcile.yml merge an AI PR.
#
#   pull_request   the PR against its base branch
#   push to main   the pushed commit against the one it replaced
#   schedule       main against main as of 25 hours ago. translate.yml merges its
#                  PRs with github.token, and pushes made with that token trigger
#                  no workflows, so without this a bot merge is never checked on main.
#   dispatch       every language, with nothing to compare against
on:
  push:
    branches: [main]
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:
  pull_request:
    paths:
      - "locale/**"
      - "messages.pot"
      - "i18n"
      - "scripts/translation_checks.py"
      - "tests/test_translation_checks.py"
      - "tests/validators.py"
      - ".github/workflows/validate-translations.yml"
      - "tests/test_i18n.py"
      - "tests/conftest.py"
      - "tests/test_locale_option.py"
      - "scripts/po_same_content.py"
      - "scripts/meaning_check.py"
      - "tests/test_meaning_check.py"
      - "tests/test_po_same_content.py"

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history so the scope guard can find this PR's merge-base off main.
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # openlibrary pins Babel 2.18.0; check-translations compiles catalogs the way
      # openlibrary does, so write_mo() must behave the same.
      - name: Install dependencies
        run: pip install "Babel==2.18.0" pytest

      - name: Choose the commit to compare against
        id: base
        env:
          EVENT: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
          BASE_REF: ${{ github.base_ref }}
        run: |
          set -euo pipefail
          case "$EVENT" in
            pull_request) git fetch -q origin "$BASE_REF"; BASE=$(git rev-parse "origin/$BASE_REF") ;;
            push) BASE="$BEFORE" ;;
            schedule) BASE=$(git rev-list -1 --before="25 hours ago" HEAD) ;;
            *) BASE="" ;;
          esac
          # A new branch (all zeros) or no commit that old: check every language as is.
          if [[ "$BASE" =~ ^0+$ ]] || ! git cat-file -e "${BASE:-none}^{commit}" 2>/dev/null; then
            BASE=""
          fi
          echo "sha=$BASE" >> "$GITHUB_OUTPUT"
          echo "comparing against ${BASE:-nothing}"

      - name: Detect changed languages
        id: changed-langs
        env:
          BASE: ${{ steps.base.outputs.sha }}
        run: |
          LANGS=""
          if [ -n "$BASE" ]; then
            LANGS=$(git diff --name-only "$BASE" HEAD \
              | grep '^locale/' \
              | cut -d/ -f2 \
              | sort -u \
              | tr '\n' ' ')
          fi
          echo "langs=$LANGS" >> "$GITHUB_OUTPUT"
          echo "Changed languages: ${LANGS:-none}"

      # A translation PR may only touch languages it actually translated. #188's
      # batch re-synced 5 languages that belonged to other PRs; when those merged
      # the batch went un-mergeably dirty and its real translations lingered.
      - name: Check scope (no stray languages)
        if: github.event_name == 'pull_request'
        run: python ./i18n check-scope --base origin/${{ github.base_ref }}

      - name: Run test_po_files (HTML structure)
        run: |
          # Only test the languages this PR changed, so a PR is never failed for a
          # language it did not touch. --locale (tests/conftest.py, tested in
          # tests/test_locale_option.py) filters on each test's locale parameter;
          # the old `-k` substring match also hit msgid text and ran nearly every
          # language for codes like tr and es (#302).
          LANGS="${{ steps.changed-langs.outputs.langs }}"
          if [ -z "${LANGS// }" ]; then
            echo "No locale changes detected — running full suite"
            python -m pytest tests/test_po_files.py -q
          else
            echo "Testing languages: $LANGS"
            # Exit 5 = no tests collected: these tests run once per translated entry,
            # so a language with none yet (a new, empty catalog, #329) has nothing
            # to check. That is a pass, not a failure.
            rc=0
            python -m pytest tests/test_po_files.py --locale "$LANGS" -q || rc=$?
            if [ "$rc" -eq 5 ]; then
              echo "No translated entries to test in: $LANGS"
            elif [ "$rc" -ne 0 ]; then
              exit "$rc"
            fi
          fi

      # Every locale, not the changed-languages list: plural and placeholder
      # regressions, and the toolbox's own checks. The sync CLI tests run on a
      # temp copy (#44), so nothing here touches a real locale file.
      - name: Run plural-form and toolbox tests
        run: |
          python -m pytest tests/test_plural_forms.py tests/test_i18n.py tests/test_locale_option.py \
            tests/test_po_same_content.py tests/test_meaning_check.py \
            tests/test_translation_checks.py -q

      - name: Validate format strings
        run: |
          LANGS="${{ steps.changed-langs.outputs.langs }}"
          python - <<'EOF'
          import sys
          from pathlib import Path
          from babel.messages.pofile import read_po
          sys.path.insert(0, str(Path('tests')))
          from validators import validate

          changed = "${{ steps.changed-langs.outputs.langs }}".split()
          locale_dir = Path("locale")
          langs = changed if changed else sorted(p.name for p in locale_dir.iterdir() if p.is_dir())

          errors_found = False
          for lang in langs:
              po_path = locale_dir / lang / "messages.po"
              with open(po_path, "rb") as f:
                  catalog = read_po(f)
              lang_errors = []
              for msg in catalog:
                  if not msg.id:
                      continue
                  errs = validate(msg, catalog)
                  if errs:
                      lang_errors.append((msg.id, errs))
              if lang_errors:
                  print(f"\n{lang}: {len(lang_errors)} error(s)")
                  for msgid, errs in lang_errors[:10]:
                      print(f"  msgid: {msgid!r}")
                      for e in errs:
                          print(e)
                  errors_found = True
              else:
                  print(f"{lang}: OK")

          if errors_found:
              sys.exit(1)
          EOF

      # What the olbase build would do with the changed languages: refuse a file
      # (rejected), ship a broken placeholder, or show English where the base
      # showed a translation. Without a base (a manual run), every language, with
      # nothing to compare against.
      - name: Check translations deploy cleanly
        env:
          BASE: ${{ steps.base.outputs.sha }}
        run: python ./i18n check-translations ${BASE:+--base "$BASE"}
